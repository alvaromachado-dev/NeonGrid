name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest  # runner padrão = gratuito
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk NeonGrid-${{ github.run_number }}.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: NeonGrid-${{ github.run_number }}
          path: NeonGrid-${{ github.run_number }}.apk

      - name: Publicar em Releases (link fácil pro celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NeonGrid build ${{ github.run_number }}
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}.
          files: NeonGrid-${{ github.run_number }}.apk
